daemon off;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
#include       C:/Users/Ania/Downloads/nginx-1.28.3/nginx-1.28.3/conf/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 85;
        server_name localhost;

        # --- MDB WebSocket proxy (must be before /vending-machines/api/) ---
        location /vending-machines/mdb_api/ws {
            proxy_pass http://127.0.0.1:1234/ota-977/MDBPay/1.0.0/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

        }

        # --- Interpreter WebSocket proxy ---
        location /vending-machines/interpreter/ws {

            #proxy_pass http://127.0.0.1:9000;
            #proxy_pass http://192.168.21.108:9000;
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

        }

        # --- MDB REST API proxy ---
        location /vending-machines/mdb_api/{
            proxy_pass http://127.0.0.1:1234/ota-977/MDBPay/1.0.0/;
        }


        # --- Arduino order → Bottle server on 8080 ---
        location /vending-machines/order {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        # --- Statservice → Bottle server on 8080 ---
        location /vending-machines/statservice/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        # --- Vending machine frontend (static files from dist/) ---
        location /vending-machines/ {
            proxy_pass http://127.0.0.1:8080/vending-machines/;
             proxy_set_header Host $host;
        }
    }
}
